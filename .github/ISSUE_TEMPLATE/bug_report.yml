name: Bug report
description: Report a reproducible problem in the library or repository tools
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys or private benchmark data. Report security issues through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.8.0 or commit SHA
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Python 3.12.10, operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest task and design that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Simulator and score versions
      description: Required for numerical or benchmark-result issues.
