[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

# SM-Bench is the benchmark application: runners, model clients, recorded
# results, dashboard and documentation site. The environments it evaluates
# with are separate packages, pinned here by tag; SM-Bench itself is not a
# library for other projects to install.
[project]
name = "sm-bench"
version = "0.8.0"
description = "Benchmark of machine-generated engineering designs, judged by physics simulation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["engineering-design", "physics-simulation", "llm", "benchmarking", "heat-exchanger"]
authors = [
    {name = "Mehmet Fatih Reyhan"},
    {name = "Ertuğrul Şahin"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
# Pin tags, not branches: simulator and score behaviour is versioned deliberately.
dependencies = [
    "sm-core @ git+https://github.com/suni-muhendis/sm-core.git@v0.8.0",
    "sm-heat-exchanger[samplers] @ git+https://github.com/suni-muhendis/sm-heat-exchanger.git@v0.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit",
    "pandas",
    "plotly",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/suni-muhendis/sm-bench"
Repository = "https://github.com/suni-muhendis/sm-bench.git"
Issues = "https://github.com/suni-muhendis/sm-bench/issues"
Changelog = "https://github.com/suni-muhendis/sm-bench/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sm_bench*"]
